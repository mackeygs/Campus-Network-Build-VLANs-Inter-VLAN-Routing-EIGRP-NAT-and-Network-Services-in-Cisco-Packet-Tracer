!
version 12.2
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Router
!
!
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface FastEthernet0/0
 no ip address
 ip nat inside
 duplex auto
 speed auto
!
interface FastEthernet0/0.1
 encapsulation dot1Q 10
 ip address 192.168.1.1 255.255.255.0
 ip helper-address 192.168.0.254
!
interface FastEthernet0/0.2
 encapsulation dot1Q 20
 ip address 192.168.2.1 255.255.255.0
 ip helper-address 192.168.0.254
!
interface FastEthernet0/0.3
 encapsulation dot1Q 30
 ip address 192.168.3.1 255.255.255.0
 ip helper-address 192.168.0.254
!
interface FastEthernet0/0.4
 encapsulation dot1Q 40
 ip address 192.168.4.1 255.255.255.0
 ip helper-address 192.168.0.254
!
interface FastEthernet0/0.5
 encapsulation dot1Q 50
 ip address 192.168.5.1 255.255.255.0
 ip helper-address 192.168.0.254
!
interface FastEthernet1/0
 ip address 192.168.0.1 255.255.255.0
 duplex auto
 speed auto
!
interface Serial2/0
 ip address 129.137.10.1 255.255.255.240
 ip nat outside
!
interface Serial3/0
 ip address 192.137.10.14 255.255.255.240
 ip nat outside
 clock rate 2000000
!
interface FastEthernet4/0
 no ip address
 shutdown
!
interface FastEthernet5/0
 no ip address
 shutdown
!
router eigrp 1
 network 129.137.10.0 0.0.0.15
 network 192.168.0.0 0.0.3.255
 network 192.168.4.0 0.0.1.255
 auto-summary
!
ip nat pool MYPOOL 129.137.10.2 129.137.10.12 netmask 255.255.255.240
ip nat inside source list 1 pool MYPOOL overload
ip classless
!
ip flow-export version 9
!
!
access-list 1 permit 192.168.0.0 0.0.7.255
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
